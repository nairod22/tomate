<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tomate — Pomodoro timer for macOS</title>
<meta name="description" content="A Pomodoro timer that lives in your macOS menu bar.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --blue: #009FE3;
    --ink: #0B0B0B;
    --muted: #8A8A8A;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; overflow-x: hidden; }
  body {
    min-height: 100vh;
    background: #FFFFFF;
    color: var(--ink);
    font-family: Inter, system-ui, sans-serif;
  }
  .wrap { max-width: 1200px; margin: 0 auto; }

  /* ===== Hero (blue block) ===== */
  .hero { background: var(--blue); padding: 28px 24px 0; overflow: hidden; }
  .nav { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }
  .brand span { font-family: 'Archivo Black', sans-serif; font-size: 22px; letter-spacing: -0.02em; }

  .intro { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 88px 0 0; }
  .eyebrow { margin: 0 0 20px; font-size: 15px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
  h1 {
    margin: 0;
    font-family: 'Archivo Black', sans-serif;
    font-weight: 400;
    font-size: clamp(88px, 17vw, 240px);
    line-height: 0.85;
    letter-spacing: -0.05em;
  }
  .tagline { margin: 32px 0 0; max-width: 520px; font-size: 22px; line-height: 1.4; font-weight: 500; }
  .cta { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 16px; margin-top: 36px; }
  .requirement { font-size: 15px; font-weight: 500; }

  /* Shared download button (hero + bottom are identical) */
  .dl-btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    min-height: 56px;
    padding: 0 30px;
    border: 0;
    border-radius: 999px;
    background: var(--ink);
    color: #FFFFFF;
    font: 600 17px Inter, system-ui, sans-serif;
    cursor: default;
  }
  .dl-btn svg { width: 18px; height: 18px; flex: none; margin-top: -2px; }

  .stage { position: relative; display: flex; justify-content: center; margin-top: 72px; height: 420px; }
  .stage-disc {
    position: absolute;
    bottom: -260px;
    width: 680px;
    max-width: 120%;
    height: 620px;
    border-radius: 50%;
    background: var(--ink);
  }
  .stage-inner { position: relative; width: 100%; max-width: 720px; display: flex; flex-direction: column; align-items: flex-end; }
  .menubar {
    width: 100%;
    height: 36px;
    border-radius: 12px;
    background: rgba(255,255,255,0.72);
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 18px;
    padding: 0 16px;
    font-size: 14px;
    font-weight: 600;
  }
  .menubar .dim { color: #444444; }
  .capsule { display: inline-flex; align-items: center; gap: 6px; padding: 3px 8px; border-radius: 6px; background: rgba(0,0,0,0.08); }

  /* ===== White section ===== */
  .main { padding: 120px 24px 0; }
  .download { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 0 0 120px; }

  /* Minimal grey text: status + footer */
  .quiet { font-size: 13px; font-weight: 400; color: var(--muted); }
  .soon { margin: 18px 0 0; }

  /* ===== Footer ===== */
  footer { padding: 0 24px 32px; }
  .footer-inner {
    border-top: 1px solid #E2E2E2;
    padding-top: 28px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 28px;
    text-align: center;
  }
  .footer-links { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 28px; }
  .footer-links a { min-height: 44px; display: inline-flex; align-items: center; gap: 6px; color: inherit; text-decoration: none; }
  .footer-links a:hover { color: var(--ink); }

  @media (max-width: 600px) {
    .hero, .main, footer { padding-left: 16px; padding-right: 16px; }
    .menubar { gap: 12px; }
  }
</style>
</head>
<body>

  <!-- ===== Hero (blue block) ===== -->
  <section class="hero">
    <div class="wrap">
      <nav class="nav">
        <a class="brand" href="#">
          <svg width="36" height="36" viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="68" r="44" fill="#009FE3" stroke="#0B0B0B" stroke-width="9"/><path d="M60 68 L60 32 A36 36 0 0 1 96 68 Z" fill="#FFFFFF"/><g fill="#0B0B0B"><ellipse cx="45" cy="22" rx="16" ry="6" transform="rotate(-25 45 22)"/><ellipse cx="75" cy="22" rx="16" ry="6" transform="rotate(25 75 22)"/><rect x="56" y="4" width="8" height="24" rx="4"/></g></svg>
          <span>tomate</span>
        </a>
      </nav>

      <div class="intro">
        <p class="eyebrow">Pomodoro timer for macOS</p>
        <h1>tomate.</h1>
        <p class="tagline">A timer that lives in your menu bar. Start a session, forget about it, and it lets you know when it’s time for a break.</p>
        <div class="cta">
          <!-- TODO(download): no release yet. Once the first GitHub Release exists, turn this
                       button into <a class="dl-btn" href="https://github.com/nairod22/tomate/releases/latest">
                       and drop aria-disabled. See internal/TODO.md. -->
          <button type="button" class="dl-btn" aria-disabled="true">

            Download for macOS
          </button>
          <span class="requirement">macOS 26 and later</span>
        </div>
      </div>

      <div class="stage">
        <div class="stage-disc"></div>
        <div class="stage-inner">
          <div class="menubar">
            <span class="dim">Wi-Fi</span>
            <span class="capsule"><svg width="14" height="14" viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="68" r="44" fill="none" stroke="#0B0B0B" stroke-width="12"/><path d="M60 68 L60 32 A36 36 0 0 1 96 68 Z" fill="#0B0B0B"/></svg>24:13</span>
            <span class="dim">Mon 11:16</span>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- ===== White section ===== -->
  <section class="main">
    <div class="wrap">
      <!--
        DEMO VIDEO — coming later.
        Planned slot, above the download button: short app demo
        (autoplay, muted, loop). Hidden until the video is ready.
      -->
      <div id="download" class="download">
        <!-- TODO(download): no release yet. Once the first GitHub Release exists, turn this
                     button into <a class="dl-btn" href="https://github.com/nairod22/tomate/releases/latest">
                     and drop aria-disabled. See internal/TODO.md. -->
        <button type="button" class="dl-btn" aria-disabled="true">
          <svg viewBox="0 0 384 512" fill="currentColor" aria-hidden="true"><path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/></svg>
          Download for macOS
        </button>
        <p class="soon quiet">Coming soon</p>
      </div>
    </div>
  </section>

  <!-- ===== Footer ===== -->
  <footer>
    <div class="wrap footer-inner quiet">
      <span>© 2026 Tomate</span>
      <div class="footer-links">
        <a href="https://github.com/nairod22/tomate/blob/main/LICENSE">MIT license</a>
        <a href="https://github.com/nairod22/tomate"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 19c-4.3 1.4-4.3-2.5-6-3m12 5v-3.5c0-1 .1-1.4-.5-2 2.8-.3 5.5-1.4 5.5-6a4.6 4.6 0 0 0-1.3-3.2 4.2 4.2 0 0 0-.1-3.2s-1.1-.3-3.5 1.3a12.3 12.3 0 0 0-6.2 0C6.5 2.8 5.4 3.1 5.4 3.1a4.2 4.2 0 0 0-.1 3.2A4.6 4.6 0 0 0 4 9.5c0 4.6 2.7 5.7 5.5 6-.6.6-.6 1.2-.5 2V21"/></svg>GitHub</a>
      </div>
    </div>
  </footer>

</body>
</html>
